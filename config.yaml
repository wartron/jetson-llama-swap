# llama-swap config for Jetson AGX Xavier (32GB unified, Volta sm_7.2).
#
# Proxies one OpenAI/Anthropic-compatible HTTP endpoint and hot-swaps the
# underlying llama-server process per requested model. Every entry below
# is a config that's been measured in ../bench_llamacpp_vllm — see
# NOTES.md for the speed numbers.
#
# Reload: `pkill -HUP llama-swap` (or just restart via start.sh).

healthCheckTimeout: 120        # most models load in <30s, but the 32B and big MoEs need longer
logLevel: info
startPort: 5800                # ${PORT} starts here and auto-increments
globalTTL: 600                 # models auto-unload after 10 min idle, freeing the GPU

macros:
  # llama-server binary, built into ./bin by install.sh. Relative path resolves
  # against llama-swap's cwd, which start.sh pins to this directory.
  llama_server: ./bin/llama-server

  # Where the GGUFs live (moved off ~/models earlier).
  gguf_dir: /data/george/models/gguf

  # Speed flags applied to every model — see REPORT_4 in the bench project.
  # KV-q8 cuts KV-cache bytes-per-token in half with no measurable speed cost
  # on Volta; flash-attn + 512 batch/microbatch is the empirical Xavier sweet
  # spot.
  speed_flags: >-
    -fa on
    -b 512 -ub 512
    -ctk q8_0 -ctv q8_0
    --no-warmup
    --metrics

  # The 0.5B-Coder draft, paired with the 7B and 14B targets for ~2x speedup.
  # Shares Qwen2 tokenizer with both Coder and Instruct variants of Qwen2.5.
  spec_coder_draft: >-
    --model-draft /data/models/gguf/Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf
    --gpu-layers-draft 99
    --spec-draft-n-max 16
    --spec-draft-p-min 0.75

models:
  # =========================================================================
  # Interactive picks — proven wins from the benchmark sweeps
  # =========================================================================

  qwen25-coder-7b:
    name: "Qwen2.5-Coder 7B Q6_K + 0.5B spec"
    description: "Best interactive config: 20.8 tok/s, sub-second TTFT. Coder-tuned."
    aliases: ["coder", "fast"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/Qwen2.5-Coder-7B-Instruct-Q6_K.gguf
      -c 2048 -ngl 99
      ${speed_flags}
      ${spec_coder_draft}
      -a qwen25-coder-7b
      --host 127.0.0.1 --port ${PORT}

  qwen25-14b:
    name: "Qwen2.5 14B Q5_K_M + 0.5B spec"
    description: "Best 14B-class on this board: 13.5 tok/s with ~85% draft acceptance."
    aliases: ["14b", "smart"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/Qwen2.5-14B-Instruct-Q5_K_M.gguf
      -c 8192 -ngl 99
      ${speed_flags}
      ${spec_coder_draft}
      -a qwen25-14b
      --host 127.0.0.1 --port ${PORT}

  qwen35-9b-mtp:
    name: "Qwen3.5 9B Q6_K (Unsloth MTP, n_max=4)"
    description: "Best thinking-model config: 13.5 tok/s via built-in MTP heads. Emits structured tool_use blocks. 96k single-slot ctx for long sessions."
    aliases: ["thinking", "9b"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/Qwen3.5-9B-Q6_K.gguf
      -c 98304 -np 1 -ngl 99
      ${speed_flags}
      --spec-type draft-mtp --spec-draft-n-max 4
      -a qwen35-9b-mtp
      --host 127.0.0.1 --port ${PORT}

  # =========================================================================
  # Speed/small picks
  # =========================================================================

  qwen25-coder-3b:
    name: "Qwen2.5-Coder 3B Q4_K_M"
    description: "Fastest coder we have. 28 tok/s, 0.6s TTFT. Limited capability."
    aliases: ["tiny", "3b"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf
      -c 2048 -ngl 99
      ${speed_flags}
      -a qwen25-coder-3b
      --host 127.0.0.1 --port ${PORT}

  qwen35-4b:
    name: "Qwen3.5 4B Q8_0"
    description: "Small thinking model. 13.8 tok/s end-to-end."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/Qwen_Qwen3.5-4B-Q8_0.gguf
      -c 8192 -ngl 99
      ${speed_flags}
      -a qwen35-4b
      --host 127.0.0.1 --port ${PORT}

  # =========================================================================
  # Other configured-and-measured models
  # =========================================================================

  nemotron-nano-9b:
    name: "Nemotron-Nano 9B v2 Q4_K_M"
    description: "NVIDIA's reasoning-tuned 9B. ~11.7 tok/s. Hidden <think> block."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/nvidia_NVIDIA-Nemotron-Nano-9B-v2-Q4_K_M.gguf
      -c 8192 -ngl 99
      ${speed_flags}
      -a nemotron-nano-9b
      --host 127.0.0.1 --port ${PORT}

  deepseek-r1-14b:
    name: "DeepSeek-R1 Distill Qwen-14B Q5_K_M"
    description: "Reasoning model in the 14B class. TTFT is hidden-think time."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/DeepSeek-R1-Distill-Qwen-14B-Q5_K_M.gguf
      -c 8192 -ngl 99
      ${speed_flags}
      -a deepseek-r1-14b
      --host 127.0.0.1 --port ${PORT}

  gemma4-e4b:
    name: "Gemma-4 E4B Q8_0"
    description: "Effective-4B dense via Per-Layer Embeddings. Thinking model."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/google_gemma-4-E4B-it-Q8_0.gguf
      -c 8192 -ngl 99
      ${speed_flags}
      -a gemma4-e4b
      --host 127.0.0.1 --port ${PORT}

  # =========================================================================
  # MoEs — big total params, ~3-4B active. See NOTES.md for the NvMap story.
  # =========================================================================

  gemma4-26b-q3ks:
    name: "Gemma-4 26B A4B Q3_K_S"
    description: "26B MoE, fits fully on GPU at Q3_K_S. 58 gen tok/s but 120s TTFT (thinking)."
    aliases: ["gemma-fast"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/google_gemma-4-26B-A4B-it-Q3_K_S.gguf
      -c 4096 -ngl 99
      ${speed_flags}
      -a gemma4-26b-q3ks
      --host 127.0.0.1 --port ${PORT}

  gemma4-26b-q4km:
    name: "Gemma-4 26B A4B Q4_K_M (--cpu-moe)"
    description: "Same 26B at higher quant; experts on CPU because the dense bits already use ~half GPU. ~7 tok/s."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/google_gemma-4-26B-A4B-it-Q4_K_M.gguf
      -c 4096 -ngl 99
      ${speed_flags}
      --cpu-moe
      -a gemma4-26b-q4km
      --host 127.0.0.1 --port ${PORT}

  # =========================================================================
  # Big dense Qwens — full GPU via --no-mmap. See ../jetson-llm/README.md
  # "Update" section: the ~10GB ceiling was mmap double-counting RAM, not
  # NvMap. With --no-mmap weights load straight into the GPU buffer with no
  # page-cached duplicate, and 18.5GB models fit on one Xavier. Expect
  # ~2.6-2.9 tg/s — slow but the largest dense quality this board can serve.
  # =========================================================================

  qwen25-coder-32b:
    name: "Qwen2.5-Coder 32B Q4_K_M (--no-mmap)"
    description: "Biggest dense coder that fits: 18.5GB full-GPU via --no-mmap. ~2.6 tg/s, 12.8 pp."
    aliases: ["coder-32b", "big-coder"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/Qwen2.5-Coder-32B-Instruct-Q4_K_M.gguf
      --no-mmap
      -c 4096 -ngl 99
      ${speed_flags}
      -a qwen25-coder-32b
      --host 127.0.0.1 --port ${PORT}

  qwen36-27b:
    name: "Qwen3.6 27B Q4_K_M (--no-mmap, 96k single-slot)"
    description: "Dense 27B, 16.7GB full-GPU via --no-mmap. ~2.9 tg/s, 16.9 pp. 96k single-slot ctx — Claude Code target."
    aliases: ["27b", "qwen36", "claude-opus-4-7"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/Qwen_Qwen3.6-27B-Q4_K_M.gguf
      --no-mmap
      -c 98304 -np 1 -ngl 99
      ${speed_flags}
      -a qwen36-27b
      --host 127.0.0.1 --port ${PORT}

  # =========================================================================
  # Vision-language models — accept image input via OpenAI chat format
  # =========================================================================

  smolvlm-500m:
    name: "SmolVLM-500M-Instruct Q8_0 + f16 mmproj"
    description: "Tiny vision-language model. Sub-second TTFT. Used by snes_bot's vision-driver script (scripts/play_vision.py); pair with grammar-constrained output to force a valid action label — the model's free-form instruction-following is weak."
    aliases: ["vision", "smolvlm"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/smolvlm-500m/SmolVLM-500M-Instruct-Q8_0.gguf
      --mmproj ${gguf_dir}/smolvlm-500m/mmproj-SmolVLM-500M-Instruct-f16.gguf
      -c 4096 -ngl 99
      -fa on -b 512 -ub 512 --no-warmup --metrics
      -a smolvlm-500m
      --host 127.0.0.1 --port ${PORT}

  # smolvlm-2.2b: returns HTTP 400 "Invalid token" on image payloads on this
  # llama.cpp build. --jinja didn't fix it. Text-only works. Skipping for
  # benchmarks until we can debug deeper (likely a SmolVLM-Instruct-specific
  # tokenizer/template bug or llama.cpp version issue).
  smolvlm-2.2b:
    name: "SmolVLM-Instruct 2.2B Q4_K_M + f16 mmproj (BROKEN — image path returns 400)"
    description: "Image requests return 400 Invalid token on this llama.cpp build. Files staged but not currently usable."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/smolvlm-2.2b/SmolVLM-Instruct-Q4_K_M.gguf
      --mmproj ${gguf_dir}/smolvlm-2.2b/mmproj-SmolVLM-Instruct-f16.gguf
      --jinja
      -c 4096 -ngl 99
      -fa on -b 512 -ub 512 --no-warmup --metrics
      -a smolvlm-2.2b
      --host 127.0.0.1 --port ${PORT}

  gemma4-e4b-vision:
    name: "Gemma-4 E4B Q8_0 + f16 mmproj (multimodal)"
    description: "Same model file as gemma4-e4b but with the vision projector loaded. Thinking model — TTFT ~30s. Pair with long decision intervals (5s+ game time) so the model has time to reason."
    aliases: ["gemma-vision"]
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/google_gemma-4-E4B-it-Q8_0.gguf
      --mmproj ${gguf_dir}/gemma4-e4b-vision/mmproj-google_gemma-4-E4B-it-f16.gguf
      --jinja
      -c 8192 -ngl 99
      -fa on -b 512 -ub 512 --no-warmup --metrics
      -a gemma4-e4b-vision
      --host 127.0.0.1 --port ${PORT}

  qwen2-vl-2b:
    name: "Qwen2-VL-2B-Instruct Q8_0 + f16 mmproj"
    description: "2B vision-language from Alibaba. Non-thinking, strong instruction-following. Used by snes_bot overnight exploration."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/qwen2-vl-2b/Qwen2-VL-2B-Instruct-Q8_0.gguf
      --mmproj ${gguf_dir}/qwen2-vl-2b/mmproj-Qwen2-VL-2B-Instruct-f16.gguf
      --jinja
      -c 4096 -ngl 99
      -fa on -b 512 -ub 512 --no-warmup --metrics
      -a qwen2-vl-2b
      --host 127.0.0.1 --port ${PORT}

  qwen25-vl-3b:
    name: "Qwen2.5-VL-3B-Instruct Q8_0 + f16 mmproj"
    description: "3B vision-language from Alibaba. Larger, better than 2B for spatial reasoning. ~2s TTFT expected."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/qwen25-vl-3b/Qwen2.5-VL-3B-Instruct-Q8_0.gguf
      --mmproj ${gguf_dir}/qwen25-vl-3b/mmproj-Qwen2.5-VL-3B-Instruct-f16.gguf
      --jinja
      -c 4096 -ngl 99
      -fa on -b 512 -ub 512 --no-warmup --metrics
      -a qwen25-vl-3b
      --host 127.0.0.1 --port ${PORT}

  qwen25-vl-7b:
    name: "Qwen2.5-VL-7B-Instruct Q4_K_M + f16 mmproj"
    description: "7B vision-language from Alibaba (Q4 quant to fit). Should give the strongest reasoning of the non-thinking vision models, ~4-6s expected TTFT."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/qwen25-vl-7b/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      --mmproj ${gguf_dir}/qwen25-vl-7b/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
      --jinja
      -c 4096 -ngl 99
      -fa on -b 512 -ub 512 --no-warmup --metrics
      -a qwen25-vl-7b
      --host 127.0.0.1 --port ${PORT}

  smolvlm2-2.2b:
    name: "SmolVLM2-Instruct 2.2B Q4_K_M + f16 mmproj"
    description: "Newer SmolVLM with video support; trying to dodge the chat-template bug that breaks v1 SmolVLM-Instruct-2.2B images."
    cmd: |
      ${llama_server}
      -m ${gguf_dir}/smolvlm2-2.2b/SmolVLM2-2.2B-Instruct-Q4_K_M.gguf
      --mmproj ${gguf_dir}/smolvlm2-2.2b/mmproj-SmolVLM2-2.2B-Instruct-f16.gguf
      --jinja
      -c 4096 -ngl 99
      -fa on -b 512 -ub 512 --no-warmup --metrics
      -a smolvlm2-2.2b
      --host 127.0.0.1 --port ${PORT}

